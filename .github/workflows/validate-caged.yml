name: Validar CAGED sin publicar
on:
  pull_request:
    paths:
      - 'app/caged.tsx'
      - 'app/manual-links.tsx'
      - 'lib/caged*'
      - 'public/manual-caged.html'
      - '.github/workflows/validate-caged.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restaurar activos sin sobrescribir
        run: cat public-assets.part* | tar --skip-old-files -xz
      # La verificación estricta de paridad con Sites sigue en pages.yml;
      # una rama de cambios debe pasar primero tests/build y sincronizarse antes del merge.
      - name: Probar contenido musical y regresiones
        run: node --test lib/*.test.mjs
      - name: Instalar dependencias
        run: npm install --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Construir versión de GitHub Pages (sin desplegar)
        run: npm run build:pages

      - name: Instalar navegador para comprobar el manual visual
        run: |
          npm install --no-save --ignore-scripts --legacy-peer-deps --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Comprobar el manual en móvil, tableta y escritorio
        run: node scripts/caged-visual-check.mjs
      - name: Conservar capturas de comprobación visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caged-revision-visual
          path: caged-visual-evidence/
          if-no-files-found: ignore
